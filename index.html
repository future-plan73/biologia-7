<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talerz pod lupą</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan: kartka z zeszytu w kratkę, zielony długopis jako akcent. Kolory składników pokarmowych
   takie same jak w prezentacji. Jeden motyw (jasny), z wyboru. */
:root{
  --paper:#fbfcfa; --grid:#e3eae1; --ink:#18261d; --muted:#56655a; --pen:#1f7a4a; --pen-soft:#e3f2e8;
  --marker:#ffe65a; --red:#c8453b; --ok:#1b7a45; --ok-soft:#e2f3e8; --bad-soft:#fbe6e4; --card:#ffffff; --line:#cfdccf;
  --bialka:#c8453b; --cukry:#d38f00; --tluszcze:#7a5cc2; --witaminy:#2f8f4e; --sole:#4a6fa5; --woda:#1f97cc; --blonnik:#8a6a3f;
  --display:"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif;
  --body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --hand:"Caveat","Bradley Hand","Comic Sans MS",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 140px}
.top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.brand small{display:block;font-size:14px;color:var(--muted);letter-spacing:.02em}
.brand h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.02em}
.topr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rank{font-family:var(--hand);font-size:24px;color:var(--pen)}
.deck-link{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:8px;padding:6px 12px;text-decoration:none;color:var(--ink);font-weight:600;background:var(--card)}

.table{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:6px 0 22px}
.el{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:84px;padding:6px 10px;border:2px solid var(--ink);border-radius:6px;background:var(--card);text-decoration:none;color:var(--ink)}
.el .nr{font-size:12px}
.el .sy{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.el .nm{font-size:12px;line-height:1.2;color:var(--muted)}
.el[aria-current="page"]{background:var(--pen);border-color:var(--pen);color:#fff}
.el[aria-current="page"] .nm{color:#d8eedf}
.el .stamp{position:absolute;top:4px;right:6px;width:22px;height:22px;border-radius:50%;border:2px solid var(--red);color:var(--red);font-size:13px;font-weight:600;display:none;align-items:center;justify-content:center;transform:rotate(-12deg);background:#fff}
.el.done .stamp{display:flex}
.strip{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:-12px 0 20px}
.strip i{flex:1}

.sheet{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(24,38,29,.35);padding:26px 26px 30px 56px;position:relative}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:36px;width:2px;background:#f2b8b3}
@media (max-width:640px){.sheet{padding:20px 16px 24px 30px}.sheet::before{left:16px}}
.lesson-head .eyebrow{font-size:14px;color:var(--muted)}
.lesson-head h2{font-size:clamp(28px,4.4vw,42px);font-weight:800;margin:4px 0 6px}
.hl{background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 92%,transparent 92%);padding:0 .08em}
.slides-link{font-size:15px;color:var(--pen);font-weight:500}
.plan{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 6px}
.plan button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;min-height:36px}
.plan button b{color:var(--pen)}
.plan-hint{font-size:13px;color:var(--muted);margin:0}
section.blk{margin-top:30px}
section.blk>h3{font-size:24px;font-weight:800;display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
section.blk>h3 .k{font-family:var(--body);font-size:13px;font-weight:500;color:#fff;background:var(--ink);border-radius:4px;padding:2px 7px;transform:translateY(-3px)}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 18px;padding:0;margin:0;list-style:none}
.tray label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 0;border-bottom:1px dashed var(--line)}
.tray input{width:22px;height:22px;accent-color:var(--pen);flex:none;margin-top:2px}
.tray input:checked+span{text-decoration:line-through;color:var(--muted)}
.riddle{border:2px solid var(--ink);border-radius:10px;padding:18px 20px;background:var(--pen-soft)}
.riddle .q{font-family:var(--hand);font-size:clamp(26px,3.6vw,34px);line-height:1.15;margin:0 0 12px}
.answer{margin-top:12px;padding:12px 14px;border-left:4px solid var(--pen);background:var(--card);border-radius:0 8px 8px 0}
.exps{display:grid;gap:14px}
.exp{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
@media (max-width:560px){.exp{grid-template-columns:1fr}.exp .pic{max-width:180px}}
.exp .pic{background:var(--paper);border-radius:8px;border:1px solid var(--line);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.exp .pic svg{width:100%;height:100%}
.exp h4{font-family:var(--display);font-size:20px;margin:0 0 4px}
.who{display:inline-block;font-size:12px;font-weight:600;border-radius:4px;padding:2px 8px;margin-bottom:6px}
.who.ty{background:var(--ok-soft);color:var(--ok)}
.who.pokaz{background:#fff2c4;color:#7a5600}
.exp ol{margin:6px 0 10px;padding-left:20px}
.ask{font-weight:600;margin:6px 0}
.btn{border:2px solid var(--pen);background:var(--pen);color:#fff;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--pen)}
.btn.small{padding:6px 12px;min-height:38px;font-size:15px}
.btn:active{transform:translateY(1px)}
.ex{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--card)}
.ex+.ex{margin-top:14px}
.ex h4{font-family:var(--display);font-size:20px;margin:0 0 4px}
.ex .sub{color:var(--muted);margin:0 0 12px;font-size:15px;max-width:65ch}
.ex-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.score{font-family:var(--hand);font-size:28px;color:var(--pen)}
fieldset.q{border:0;border-bottom:1px solid var(--grid);margin:0;padding:10px 0}
fieldset.q legend{padding:0;font-weight:500}
.qn{color:var(--muted);margin-right:4px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:44px;background:var(--paper)}
.opt input{width:20px;height:20px;accent-color:var(--pen);margin:0}
.opt:has(input:checked){border-color:var(--pen);background:var(--pen-soft)}
.q.ok .opt:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.q.bad .opt:has(input:checked){border-color:var(--red);background:var(--bad-soft)}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.q.empty legend::after{content:"  ← bez odpowiedzi";color:var(--red);font-size:14px}
.why{margin:8px 0 0;font-size:15px;color:var(--muted)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr minmax(200px,280px);gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--grid)}
@media (max-width:560px){.row{grid-template-columns:1fr}}
select,input[type=text]{border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--paper);min-height:44px;width:100%}
select.ok,input.ok{border-color:var(--ok);background:var(--ok-soft)}
select.bad,input.bad{border-color:var(--red);background:var(--bad-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:10px;min-height:60px;margin-bottom:12px}
.pool:empty::before{content:"Wszystko posortowane. Sprawdź odpowiedzi.";color:var(--muted);font-size:15px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bin{border:2px solid var(--ink);border-radius:10px;padding:10px;min-height:120px;background:var(--paper);border-top-width:8px}
.bin h5{margin:0 0 8px;font-family:var(--display);font-size:17px}
.bin .items{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--card)}
.chip .t{font-weight:500}
.chip .to{display:flex;flex-wrap:wrap;gap:4px}
.chip .to button{border:1.5px solid var(--pen);color:var(--pen);background:#fff;border-radius:6px;font-size:13px;padding:4px 8px;cursor:pointer;min-height:34px}
.bin .chip{flex-direction:row;align-items:center}
.bin .chip button.back{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;min-height:30px;padding:0 4px}
.chip.ok{border-color:var(--ok);background:var(--ok-soft)}
.chip.bad{border-color:var(--red);background:var(--bad-soft)}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:620px}
.card{aspect-ratio:1/1;border:2px solid var(--ink);border-radius:8px;background:var(--pen);color:#fff;font-family:var(--display);font-weight:800;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;line-height:1.1}
.card.up{background:var(--card);color:var(--ink)}
.card.found{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);cursor:default}
.takeaway{border:2px solid var(--ink);border-radius:10px;padding:16px 18px;background:#fffbea}
.takeaway p.cloze{font-size:19px;line-height:2.1;margin:0;max-width:65ch}
.cloze input{display:inline-block;width:auto;min-width:5ch;padding:2px 8px;min-height:36px;font-size:17px;border-width:0 0 2px;border-radius:0;background:transparent;border-color:var(--pen)}
.cloze input.ok{background:var(--ok-soft);border-color:var(--ok)}
.cloze input.bad{background:var(--bad-soft);border-color:var(--red)}
.finish{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:30px;padding-top:18px;border-top:2px dashed var(--line)}
.finish .btn.stamped{background:var(--ok);border-color:var(--ok)}
.locks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lock{border:2px solid var(--ink);border-radius:10px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.lock h4{font-family:var(--display);font-size:18px;margin:0;display:flex;justify-content:space-between;align-items:center}
.lock .pad{display:flex;gap:8px}
.lock input{width:70px;text-align:center;font-size:22px;font-weight:600}
.lock.open{border-color:var(--ok);background:var(--ok-soft)}
.lock .digit{font-family:var(--display);font-weight:800;font-size:40px;color:var(--ok);line-height:1}
.lock .state{font-size:22px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.safe{margin-top:16px;border:3px solid var(--ink);border-radius:12px;padding:18px;background:var(--pen-soft);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.safe input{max-width:180px;font-size:26px;letter-spacing:.3em;text-align:center}
.diploma{margin-top:16px;border:6px double var(--pen);border-radius:12px;padding:28px 22px;text-align:center;background:var(--card)}
.diploma .t1{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.diploma h3{font-size:clamp(28px,5vw,44px);font-weight:800;margin:8px 0}
.diploma .name{font-family:var(--hand);font-size:42px;color:var(--pen);border-bottom:2px solid var(--line);display:inline-block;min-width:60%;padding:0 10px}
.diploma .nameinp{max-width:320px;margin:10px auto 0}
.mind{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mind .box{border-radius:10px;padding:14px;color:#fff}
.mind .box h5{font-family:var(--display);font-size:18px;margin:0 0 6px}
.mind ul{margin:0;padding-left:18px;font-size:15px}
.mind .rule{grid-column:1/-1;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:14px}
.timer{position:fixed;right:14px;bottom:14px;z-index:20;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:calc(100% - 28px);flex-wrap:wrap}
.timer .lbl{font-size:12px;color:#b9cdbf;display:block}
.timer .time{font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.timer button{border:1.5px solid #4c6253;background:transparent;color:#fff;border-radius:8px;min-height:40px;min-width:44px;padding:4px 10px;cursor:pointer;font-size:14px}
.timer button.go{background:var(--marker);border-color:var(--marker);color:var(--ink);font-weight:600}
.timer.end{background:var(--marker);color:var(--ink)}
.timer.end .lbl{color:var(--ink)}
.timer.end button{color:var(--ink);border-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.timer.end{animation:pulse 1s ease-in-out infinite alternate}}
@keyframes pulse{to{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <small>Biologia 7 · Składniki pokarmowe i ich znaczenie dla organizmu · zajęcia online</small>
      <h1>Talerz pod lupą</h1>
    </div>
    <div class="topr">
      <a class="deck-link" href="prezentacja.html">Prezentacja →</a>
      <div class="rank" id="rank" aria-live="polite"></div>
    </div>
  </header>
  <nav class="table" id="nav" aria-label="Części lekcji"></nav>
  <div class="strip" aria-hidden="true"><i style="background:var(--bialka)"></i><i style="background:var(--cukry)"></i><i style="background:var(--tluszcze)"></i><i style="background:var(--witaminy)"></i><i style="background:var(--sole)"></i><i style="background:var(--woda)"></i><i style="background:var(--blonnik)"></i></div>
  <main class="sheet" id="main"></main>
</div>

<div class="timer" id="timer" role="timer" aria-label="Minutnik">
  <div><span class="lbl" id="tLbl">Minutnik</span><span class="time" id="tTime">05:00</span></div>
  <button type="button" id="tGo" class="go">Start</button>
  <button type="button" data-min="3">3′</button>
  <button type="button" data-min="5">5′</button>
  <button type="button" data-min="10">10′</button>
  <button type="button" data-min="15">15′</button>
</div>

<script>
/* ---------- ilustracje ---------- */
const K='#18261d';
const S=(c)=>`<svg viewBox="0 0 120 90" aria-hidden="true">${c}</svg>`;
const ICONS={
 iodine:S(`<path d="M20 60 C18 44 46 40 60 44 C74 48 74 70 58 74 C40 78 22 74 20 60Z" fill="#d6a965" stroke="${K}" stroke-width="3"/><ellipse cx="46" cy="58" rx="10" ry="6" fill="#2b2f7a"/><rect x="78" y="10" width="12" height="40" rx="3" fill="#8a4a1f" stroke="${K}" stroke-width="2"/><path d="M80 50 L84 62 L88 50" fill="#e8e8e8" stroke="${K}" stroke-width="2"/><circle cx="84" cy="70" r="3" fill="#7a3a12"/>`),
 paper:S(`<rect x="18" y="12" width="84" height="66" rx="4" fill="#fff" stroke="${K}" stroke-width="3"/><circle cx="42" cy="34" r="12" fill="none" stroke="#cfdccf" stroke-width="2" stroke-dasharray="3 3"/><circle cx="78" cy="34" r="12" fill="#f1e6a8" stroke="#d6c46a" stroke-width="2"/><circle cx="42" cy="60" r="12" fill="#f6edc0" stroke="#d6c46a" stroke-width="2"/><circle cx="78" cy="60" r="12" fill="none" stroke="#cfdccf" stroke-width="2" stroke-dasharray="3 3"/>`),
 bread:S(`<path d="M24 44 C24 26 96 26 96 44 C96 52 90 52 90 52 V76 H30 V52 C30 52 24 52 24 44Z" fill="#e0b070" stroke="${K}" stroke-width="3" stroke-linejoin="round"/><path d="M36 50 V70 H84 V50" fill="#f6e2b8"/><text x="60" y="66" text-anchor="middle" font-size="14" font-family="Lexend, Arial" fill="#c8453b">słodki?</text>`),
 label:S(`<rect x="28" y="8" width="64" height="76" rx="4" fill="#f4e4c8" stroke="${K}" stroke-width="3"/><rect x="36" y="30" width="48" height="46" fill="#fff" stroke="${K}" stroke-width="1.5"/><g stroke="#cfdccf" stroke-width="2"><path d="M40 40 H80 M40 48 H80 M40 56 H80 M40 64 H80"/></g><text x="60" y="24" text-anchor="middle" font-size="11" font-family="Lexend, Arial" fill="${K}">PŁATKI</text>`),
 cucumber:S(`<rect x="16" y="58" width="88" height="22" rx="5" fill="#fff" stroke="${K}" stroke-width="3"/><rect x="44" y="62" width="32" height="12" rx="2" fill="${K}"/><text x="60" y="71" text-anchor="middle" font-size="9" fill="#ffe65a" font-family="Lexend, Arial">50 g</text><path d="M24 52 H96" stroke="${K}" stroke-width="3"/>${[36,52,68,84].map(x=>`<circle cx="${x}" cy="40" r="9" fill="#cfe8b0" stroke="#2f8f4e" stroke-width="3"/>`).join('')}`),
 flax:S(`<path d="M14 30 L18 80 H50 L54 30Z" fill="#cfe8f6"/><path d="M12 22 L18 80 H50 L56 22" fill="none" stroke="${K}" stroke-width="3"/><g fill="#8a5a33">${[[26,70],[34,66],[42,72],[30,60],[40,58]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="3" ry="2"/>`).join('')}</g><path d="M18 52 q16 -8 32 0" stroke="#c9b48a" stroke-width="10" opacity=".55" fill="none"/><path d="M68 30 L72 80 H104 L108 30Z" fill="#cfe8f6"/><path d="M66 22 L72 80 H104 L110 22" fill="none" stroke="${K}" stroke-width="3"/><text x="34" y="14" text-anchor="middle" font-size="10" fill="#56655a" font-family="Lexend, Arial">siemię</text><text x="88" y="14" text-anchor="middle" font-size="10" fill="#56655a" font-family="Lexend, Arial">cukier</text>`),
 rainbow:S(`${['#c8453b','#e07b14','#2f8f4e','#5b3f8f','#efe7d6'].map((c,i)=>`<circle cx="${20+i*20}" cy="${45+(i%2?10:-10)}" r="13" fill="${c}" stroke="${K}" stroke-width="2"/>`).join('')}`),
 plate:S(`<circle cx="60" cy="45" r="38" fill="#fff" stroke="${K}" stroke-width="3"/><path d="M60 45 L60 13 A32 32 0 0 0 60 77Z" fill="#2f8f4e"/><path d="M60 45 L60 13 A32 32 0 0 1 92 45Z" fill="#d38f00"/><path d="M60 45 L92 45 A32 32 0 0 1 60 77Z" fill="#c8453b"/>`)
};

/* ---------- treść ---------- */
const PLAN=[['Rozgrzewka',5],['Zagadka',5],['Doświadczenie',18],['Przerwa od ekranu',3],['Teoria / slajdy',10],['Gra',11],['Na wynos',8]];
const L=[
{sy:'Bi',nm:'Energia i budulec',slides:4,title:'Białka, cukry i tłuszcze',topic:'Rodzaje składników, ich źródła i znaczenie',
 tray:['talerzyk','plasterek surowego ziemniaka','kawałek chleba','plasterek sera','kawałek jabłka','kilka ziarenek ugotowanego ryżu','jodyna (kapie dorosły)','kartka papieru, odrobina oleju, orzech, łyżeczka wody'],

const R={
 quiz(b,id){return `<div class="ex" id="${id}">${exHead(b)}${b.items.map((it,i)=>{const opts=it[3]||b.o;return `<fieldset class="q" data-a="${it[1]}"><legend><span class="qn">${i+1}.</span>${it[0]}</legend><div class="opts">${opts.map((o,j)=>`<label class="opt"><input type="radio" name="${id}-${i}" value="${j}"><span>${o}</span></label>`).join('')}</div>${it[2]?`<p class="why" hidden>${it[2]}</p>`:''}</fieldset>`}).join('')}${actions('quiz')}</div>`},

  }
  h+=sec('Zagadka na start')+`<div class="riddle"><p class="q">${l.riddle.q}</p><button type="button" class="btn ghost" data-reveal>Pokaż odpowiedź</button><div class="answer" hidden>${l.riddle.a}</div></div></section>`;
  if(l.exps)h+=sec('Doświadczenia przy kamerze')+`<div class="exps">${l.exps.map(e=>`<article class="exp"><div class="pic">${ICONS[e.icon]}</div><div><span class="who ${e.who}">${e.who==='ty'?'Robisz sama':'Pokaz prowadzącego'}</span><h4>${e.title}</h4><ol>${e.steps.map(s=>`<li>${s}</li>`).join('')}</ol><p class="ask">${e.ask}</p><button type="button" class="btn ghost small" data-reveal>Co się stało?</button><div class="answer" hidden>${e.a}</div></div></article>`).join('')}</div></section>`;
  h+=sec(l.escape?'Gra':'Ćwiczenia i gry')+l.blocks.map((b,i)=>{const id=`b${n}-${i}`;BLOCKS[id]=b;return R[b.type](b,id)}).join('')+`</section>`;
  if(l.take)h+=sec('3 zdania na wynos')+`<div class="ex takeaway" id="take-${n}"><p class="sub">Uzupełnij luki, sprawdź, a potem przepisz zdania do zeszytu i wyślij zdjęcie.</p><p class="cloze">${cloze(l.take,'take'+n)}</p>${actions('cloze')}</div></section>`;
  const done=state.done.includes(n);
  h+=`<div class="finish"><button type="button" class="btn${done?' stamped':''}" data-stamp>${done?'Pieczątka przybita ✓':'Zaliczone! Przybij pieczątkę'}</button><div style="display:flex;gap:8px;flex-wrap:wrap">${n>1?`<a class="btn ghost" href="#czesc-${n-1}">← Część ${n-1}</a>`:''}${n<L.length?`<a class="btn ghost" href="#czesc-${n+1}">Część ${n+1} →</a>`:''}</div></div>`;
  $('#main').innerHTML=h;
}
function render(){renderNav();renderLesson()}

/* ---------- sprawdzanie ---------- */
function setScore(ex,ok,all){const s=$('.score',ex);if(s)s.textContent=`${ok} / ${all}${ok===all?' · brawo!':''}`}
const CHECK={
 quiz(ex){let ok=0;const fs=$$('fieldset.q',ex);fs.forEach(f=>{f.classList.remove('ok','bad','empty');$$('.opt',f).forEach(o=>o.classList.remove('missed'));const c=$('input:checked',f);if(!c){f.classList.add('empty');return}const g=c.value===f.dataset.a;f.classList.add(g?'ok':'bad');if(g)ok++;else $$('.opt',f).forEach(o=>o.classList.toggle('missed',$('input',o).value===f.dataset.a));const w=$('.why',f);if(w)w.hidden=false});setScore(ex,ok,fs.length)},
 match(ex){let ok=0;const ss=$$('select',ex);ss.forEach(s=>{s.classList.remove('ok','bad');const g=s.value===s.dataset.a;s.classList.add(g?'ok':'bad');if(g)ok++});setScore(ex,ok,ss.length)},
 sort(ex){let ok=0;const all=$$('.chip',ex);$$('.bin',ex).forEach(b=>$$('.chip',b).forEach(c=>{const g=c.dataset.a===b.dataset.bin;c.classList.remove('ok','bad');c.classList.add(g?'ok':'bad');if(g)ok++}));setScore(ex,ok,all.length)},
 cloze(ex){let ok=0;const is=$$('.cloze input',ex);is.forEach(i=>{i.classList.remove('ok','bad');const g=i.dataset.a.split('|').some(a=>norm(a)===norm(i.value));i.classList.add(g?'ok':'bad');if(g)ok++});setScore(ex,ok,is.length);if(ok<is.length)$('.score',ex).textContent+=' · popraw czerwone luki'}
};

/* ---------- zdarzenia ---------- */
let memOpen=[];
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const ex=t.closest('.ex');
  if(t.matches('[data-reveal]')){const a=t.nextElementSibling;a.hidden=!a.hidden;t.textContent=a.hidden?(t.closest('.riddle')?'Pokaż odpowiedź':'Co się stało?'):'Ukryj';return}
  if(t.matches('[data-check]')){CHECK[t.dataset.check](ex);return}
  if(t.matches('[data-reset]')){const id=ex.id;if(id.startsWith('take-')){$$('input',ex).forEach(i=>{i.value='';i.classList.remove('ok','bad')});$('.score',ex).textContent='';return}ex.outerHTML=R[BLOCKS[id].type](BLOCKS[id],id);memOpen=[];return}
  if(t.dataset.to!==undefined){const c=t.closest('.chip');c.classList.remove('ok','bad');$('.to',c).hidden=true;if(!$('.back',c))c.insertAdjacentHTML('beforeend','<button type="button" class="back" aria-label="Cofnij">↩</button>');$(`.bin[data-bin="${t.dataset.to}"] .items`,ex).appendChild(c);return}
  if(t.matches('.back')){const c=t.closest('.chip');c.classList.remove('ok','bad');t.remove();$('.to',c).hidden=false;$('.pool',ex).appendChild(c);return}
  if(t.matches('.card')){memClick(t,ex);return}
  if(t.matches('[data-lock]')){const l=t.closest('.lock'),i=$('input',l),w=$('.why',l);if(i.value.trim()===l.dataset.a){l.classList.add('open');$('.state',l).textContent='🔓';$('.pad',l).outerHTML=`<div class="digit">${l.dataset.a}</div>`;w.hidden=true}else{l.classList.remove('shake');void l.offsetWidth;l.classList.add('shake');w.hidden=false;w.textContent='Nie ta cyfra. Policz jeszcze raz.'}return}
  if(t.matches('[data-safe]')){const i=$('.safe input',ex),s=$('.safe .score',ex);if(i.value.trim()===CODE){s.textContent='Sejf otwarty!';const d=$('.diploma',ex);d.hidden=false;d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'})}else s.textContent='Zły kod. Sprawdź kłódki.';return}
  if(t.matches('[data-stamp]')){const n=state.lesson;if(!state.done.includes(n))state.done.push(n);store.set('done',state.done);render();return}
  if(t.matches('[data-plan]')){setTimer(+t.dataset.plan,t.dataset.lbl);return}
});
document.addEventListener('input',e=>{if(e.target.matches('.nameinp input')){$('.name',e.target.closest('.diploma')).textContent=e.target.value||'…'}});
function memClick(c,ex){
  if(c.classList.contains('found')||c.classList.contains('up')||memOpen.length===2)return;
  c.classList.add('up');c.textContent=c.dataset.t;memOpen.push(c);
  if(memOpen.length===2){const [a,b]=memOpen;
    if(a.dataset.k===b.dataset.k){a.classList.add('found');b.classList.add('found');memOpen=[];const f=$$('.card.found',ex).length/2,all=$$('.card',ex).length/2;$('.score',ex).textContent=`Pary: ${f} / ${all}${f===all?' · brawo!':''}`}
    else setTimeout(()=>{[a,b].forEach(x=>{x.classList.remove('up');x.textContent='?'});memOpen=[]},1300)}
}

/* ---------- minutnik ---------- */
let tLeft=300,tRun=null;const tEl=$('#timer'),tTime=$('#tTime'),tLbl=$('#tLbl'),tGo=$('#tGo');
const tShow=()=>{tTime.textContent=String(Math.floor(tLeft/60)).padStart(2,'0')+':'+String(tLeft%60).padStart(2,'0')};
function setTimer(min,lbl){clearInterval(tRun);tRun=null;tLeft=min*60;tLbl.textContent=lbl||'Minutnik';tEl.classList.remove('end');tGo.textContent='Start';tShow()}
tGo.addEventListener('click',()=>{if(tRun){clearInterval(tRun);tRun=null;tGo.textContent='Start';return}if(tLeft<=0)tLeft=60;tEl.classList.remove('end');tGo.textContent='Pauza';tRun=setInterval(()=>{tLeft--;tShow();if(tLeft<=0){clearInterval(tRun);tRun=null;tGo.textContent='Start';tEl.classList.add('end');tLbl.textContent='Czas minął!'}},1000)});
$$('#timer [data-min]').forEach(b=>b.addEventListener('click',()=>setTimer(+b.dataset.min)));tShow();

/* ---------- routing ---------- */
function fromHash(){const m=location.hash.match(/^#czesc-([1-4])$/);return m?+m[1]:null}
window.addEventListener('hashchange',()=>{state.lesson=fromHash()||1;store.set('last',state.lesson);render();window.scrollTo(0,0)});
state.lesson=fromHash()||store.get('last',1);render();
</script>
